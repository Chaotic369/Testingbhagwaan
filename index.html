<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  :root {
    --bg-base: #140f0b;
    --card-bg: rgba(28, 20, 15, 0.74);
    --card-border: rgba(254, 215, 170, 0.12);
    --card-glow: rgba(249, 115, 22, 0.25);
    --accent: #f97316;
    --accent-glow: #fed7aa;
    --accent-gradient: linear-gradient(135deg, #fef3c7 0%, #fb923c 50%, #ea580c 100%);
    --text-main: #fffbeb;
    --text-muted: #d4bca7;
    --text-sub: #a18a77;
    --track-bar: rgba(254, 215, 170, 0.14);
  }

  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient Aurora Lights */
  .aurora-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .aurora-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.5;
    transition: all 1.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .orb-1 {
    width: 520px;
    height: 520px;
    top: -100px;
    left: 15%;
    background: radial-gradient(circle, #f97316 0%, transparent 70%);
  }

  .orb-2 {
    width: 480px;
    height: 480px;
    bottom: -80px;
    right: 15%;
    background: radial-gradient(circle, #fef08a 0%, transparent 70%);
  }

  .orb-3 {
    width: 380px;
    height: 380px;
    top: 40%;
    left: 45%;
    background: radial-gradient(circle, #ea580c 0%, transparent 70%);
  }

  /* Master Container */
  .app-layout {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 960px;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .player-card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-radius: 36px;
    padding: 32px 28px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 60px var(--card-glow);
    transition: box-shadow 0.6s ease, border-color 0.6s ease;
    overflow: hidden;
  }

  /* Header Top Bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-muted);
    width: 42px;
    height: 42px;
    border-radius: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }

  .icon-btn:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .icon-btn:active {
    transform: scale(0.94);
  }

  .icon-btn.active {
    color: #f97316;
    background: rgba(249, 115, 22, 0.15);
    border-color: rgba(249, 115, 22, 0.35);
  }

  .top-title {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* Artwork & Vinyl Container */
  .artwork-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vinyl-disc {
    position: absolute;
    width: 86%;
    height: 86%;
    background: repeating-radial-gradient(circle at center, #0f0f0f, #0f0f0f 2px, #1c1c1c 3px, #0f0f0f 4px);
    border-radius: 50%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.6s ease;
    left: 50%;
    transform: translateX(-50%) rotate(0deg);
    z-index: 1;
  }

  .player-card.playing .vinyl-disc {
    left: 72%;
    transform: translateX(0) rotate(360deg);
    animation: spinVinyl 8s linear infinite;
  }

  @keyframes spinVinyl {
    0% { transform: translateX(0) rotate(0deg); }
    100% { transform: translateX(0) rotate(360deg); }
  }

  .vinyl-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32%;
    height: 32%;
    background: var(--accent-gradient);
    border-radius: 50%;
    border: 3px solid #140f0b;
  }

  .album-art-wrap {
    position: relative;
    width: 82%;
    height: 82%;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    z-index: 2;
    background: #000;
  }

  .album-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .visualizer-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .player-card.visualizer-active .visualizer-overlay {
    opacity: 1;
  }

  #vizCanvas {
    width: 100%;
    height: 100%;
  }

  /* Track Meta & Like */
  .track-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .track-meta {
    flex: 1;
    min-width: 0;
    padding-right: 12px;
  }

  .track-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }

  .track-artist {
    font-size: 0.88rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .like-button {
    background: transparent;
    border: none;
    color: var(--text-sub);
    cursor: pointer;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .like-button svg {
    width: 22px;
    height: 22px;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .like-button:hover {
    color: var(--accent);
    background: rgba(249, 115, 22, 0.08);
  }

  .like-button.liked {
    color: #ef4444;
  }

  .like-button.liked svg {
    fill: #ef4444;
    transform: scale(1.15);
  }

  /* Progress Bar */
  .progress-section {
    margin-bottom: 24px;
  }

  .progress-bar-container {
    width: 100%;
    height: 6px;
    background: var(--track-bar);
    border-radius: 99px;
    cursor: pointer;
    position: relative;
    margin-bottom: 10px;
    overflow: visible;
  }

  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--accent-gradient);
    border-radius: 99px;
  }

  .progress-scrubber {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 14px;
    height: 14px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    transition: transform 0.2s ease;
  }

  .progress-bar-container:hover .progress-scrubber {
    transform: translateY(-50%) scale(1);
  }

  .time-stamps {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }

  /* Controls Row */
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .control-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .control-btn svg {
    width: 20px;
    height: 20px;
  }

  .control-btn:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.06);
  }

  .control-btn.active {
    color: var(--accent);
    background: rgba(249, 115, 22, 0.12);
  }

  .play-pause-btn {
    width: 64px;
    height: 64px;
    background: var(--accent-gradient);
    color: #140f0b;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
  }

  .play-pause-btn svg {
    width: 26px;
    height: 26px;
    fill: currentColor;
  }

  .play-pause-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 15px 30px rgba(249, 115, 22, 0.6);
  }

  .play-pause-btn:active {
    transform: scale(0.95);
  }

  /* Volume Row */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
  }

  .volume-row svg {
    width: 18px;
    height: 18px;
    color: var(--text-sub);
  }

  .vol-slider-wrap {
    flex: 1;
    height: 6px;
    background: var(--track-bar);
    border-radius: 99px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .vol-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 70%;
    background: var(--text-muted);
    border-radius: 99px;
    transition: background 0.2s ease;
  }
@@ none

  .vol-slider-wrap:hover .vol-fill {
    background: var(--accent-glow);
  }

  .badge-tag {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  /* Playlist Drawer Modal */
  .playlist-drawer {
    position: absolute;
    inset: 0;
    background: rgba(20, 15, 11, 0.95);
    backdrop-filter: blur(28px);
    border-radius: 36px;
    padding: 32px 24px;
    z-index: 50;
    transform: translateY(105%);
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
  }

  .playlist-drawer.open {
    transform: translateY(0);
  }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .drawer-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .drawer-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .drawer-list::-webkit-scrollbar {
    width: 4px;
  }

  .drawer-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 99px;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: transparent;
    border: 1px solid transparent;
  }

  .track-item:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .track-item.active {
    background: rgba(139, 92, 246, 0.12);
    border-color: rgba(139, 92, 246, 0.3);
  }

  .track-item-img {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    object-fit: cover;
  }

  .track-item-info {
    flex: 1;
    min-width: 0;
  }

  .track-item-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-item.active .track-item-name {
    color: var(--accent-glow);
  }

  .track-item-sub {
    font-size: 0.76rem;
    color: var(--text-muted);
  }

  .track-item-duration {
    font-size: 0.75rem;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }
</style>

      bpm: 110,
      chords: [293.66, 369.99, 440.00, 554.37], // Dmaj7 synthwave
      coverSvg: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23f43f5e"/><stop offset="50%" stop-color="%238b5cf6"/><stop offset="100%" stop-color="%23090d16"/></linearGradient></defs><rect width="600" height="600" fill="url(%23g2)"/><polygon points="300,120 480,480 120,480" fill="none" stroke="%23fbbf24" stroke-width="8" opacity="0.75"/><circle cx="300" cy="340" r="90" fill="%23f43f5e" opacity="0.5"/><line x1="60" y1="480" x2="540" y2="480" stroke="%23fff" stroke-width="2" opacity="0.3"/></svg>`
    },
    {
      id: 2,
      title: 'Starlight Sanctuary',
      artist: 'Solaris & Celestial Drift',
      duration: 220,
      theme: {
        glow: 'rgba(16, 185, 129, 0.35)',
        accent1: '#10b981',
        accent2: '#06b6d4',
        orb1: '#059669',
        orb2: '#0284c7',
        orb3: '#10b981'
      },
      bpm: 72,
      chords: [220.00, 261.63, 329.63, 392.00], // Amin7 deep calm
      coverSvg: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><radialGradient id="g3" cx="50%" cy="50%" r="65%"><stop offset="0%" stop-color="%2310b981"/><stop offset="60%" stop-color="%23083344"/><stop offset="100%" stop-color="%23020617"/></radialGradient></defs><rect width="600" height="600" fill="url(%23g3)"/><circle cx="300" cy="300" r="180" fill="none" stroke="%2338bdf8" stroke-width="4" stroke-dasharray="8 12" opacity="0.6"/><circle cx="300" cy="300" r="110" fill="%2306b6d4" opacity="0.35"/><circle cx="300" cy="300" r="40" fill="%23f8fafc" opacity="0.9"/></svg>`
    },
    {
      id: 3,
      title: 'Velvet Raindrops',
      artist: 'Noc Nocturne',
      duration: 145,
      theme: {
        glow: 'rgba(99, 102, 241, 0.4)',
        accent1: '#3b82f6',
        accent2: '#a855f7',
        orb1: '#3b82f6',
        orb2: '#9333ea',
        orb3: '#6366f1'
      },
      bpm: 88,
      chords: [349.23, 440.00, 523.25, 659.25], // Fmaj7
      coverSvg: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><linearGradient id="g4" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="%231e1b4b"/><stop offset="60%" stop-color="%234338ca"/><stop offset="100%" stop-color="%23c084fc"/></linearGradient></defs><rect width="600" height="600" fill="url(%23g4)"/><circle cx="160" cy="180" r="110" fill="%23a855f7" opacity="0.45"/><circle cx="440" cy="400" r="150" fill="%233b82f6" opacity="0.35"/></svg>`
    }
  ];

  // State
  let currentIndex = 0;
  let isPlaying = false;
  let isMuted = false;
  let currentVolume = 0.75;
  let isShuffle = false;
  let isLoop = false;
  let isLiked = false;
  let currentTimeSec = 0;
  let playbackTimer = null;

  // Web Audio Synthesis Engine (Generates warm, melodic lo-fi / chill soundscapes)
  let audioCtx = null;
  let masterGain = null;
  let analyser = null;
  let synthInterval = null;
  let stepIndex = 0;

  function initAudioEngine() {
    if (audioCtx) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;

    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);

    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function playSynthChord(track) {
    if (!audioCtx || !isPlaying) return;

    const baseChord = track.chords;
    const root = baseChord[stepIndex % baseChord.length];
    stepIndex++;

    // Sub bass note
    playTone(root / 2, 'sine', 1.8, 0.22, 120);

    // Warm chord note with low-pass warmth
    const midNote = baseChord[(stepIndex + 1) % baseChord.length];
    playTone(midNote, 'triangle', 2.0, 0.12, 600);

    // Soft melody sparkle
    if (Math.random() > 0.3) {
      setTimeout(() => {
        if (!isPlaying || !audioCtx) return;
        const spark = baseChord[Math.floor(Math.random() * baseChord.length)] * 2;
        playTone(spark, 'sine', 1.2, 0.08, 1200);
      }, 400);
    }
  }

  function playTone(freq, type, duration, gainVal, filterFreq) {
    try {
      const osc = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, audioCtx.currentTime);

      // Smooth envelope attack and release
      const now = audioCtx.currentTime;
      noteGain.gain.setValueAtTime(0, now);
      noteGain.gain.linearRampToValueAtTime(gainVal, now + 0.12);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(filter);
      filter.connect(noteGain);
      noteGain.connect(masterGain);

      osc.start(now);
      osc.stop(now + duration);
    } catch (e) {
      console.warn(e);
    }
  }

  function startMusicLoop() {
    if (synthInterval) clearInterval(synthInterval);
    const track = TRACKS[currentIndex];
    const intervalMs = (60 / track.bpm) * 1000 * 2;
    playSynthChord(track);
    synthInterval = setInterval(() => {
      playSynthChord(track);
    }, intervalMs);
  }

  function stopMusicLoop() {
    if (synthInterval) {
      clearInterval(synthInterval);
      synthInterval = null;
    }
  }

  // DOM Elements
  const playerCard = document.getElementById('playerCard');
  const albumCover = document.getElementById('albumCover');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const loopBtn = document.getElementById('loopBtn');
  const likeBtn = document.getElementById('likeBtn');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const currentTimeEl = document.getElementById('currentTime');
  const totalDurationEl = document.getElementById('totalDuration');
  const volTrack = document.getElementById('volTrack');
  const volFill = document.getElementById('volFill');
  const volBtn = document.getElementById('volBtn');
  const volIcon = document.getElementById('volIcon');
  const playlistToggle = document.getElementById('playlistToggle');
  const playlistDrawer = document.getElementById('playlistDrawer');
  const closeDrawer = document.getElementById('closeDrawer');
  const drawerList = document.getElementById('drawerList');
  const orb1 = document.getElementById('orb1');
  const orb2 = document.getElementById('orb2');
  const orb3 = document.getElementById('orb3');
  const vizCanvas = document.getElementById('vizCanvas');
  const vizCtx = vizCanvas.getContext('2d');

  function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
  }

  function loadTrack(index) {
    currentIndex = index;
    const track = TRACKS[currentIndex];

    trackTitle.textContent = track.title;
    trackArtist.textContent = track.artist;
    albumCover.src = track.coverSvg;
    currentTimeSec = 0;
    updateProgressUI();

    totalDurationEl.textContent = formatTime(track.duration);

    // Dynamic Atmosphere Glow
    playerCard.style.setProperty('--card-glow', track.theme.glow);
    orb1.style.background = `radial-gradient(circle, ${track.theme.orb1} 0%, transparent 70%)`;
    orb2.style.background = `radial-gradient(circle, ${track.theme.orb2} 0%, transparent 70%)`;
    orb3.style.background = `radial-gradient(circle, ${track.theme.orb3} 0%, transparent 70%)`;

    renderPlaylistItems();

    if (isPlaying) {
      startMusicLoop();
    }
  }

  function togglePlay() {
    initAudioEngine();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    isPlaying = !isPlaying;

    if (isPlaying) {
      playerCard.classList.add('playing');
      playIcon.innerHTML = `<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>`;
      startMusicLoop();
      startPlaybackTimer();
    } else {
      playerCard.classList.remove('playing');
      playIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
      stopMusicLoop();
      stopPlaybackTimer();
    }
  }

  function startPlaybackTimer() {
    stopPlaybackTimer();
    playbackTimer = setInterval(() => {
      currentTimeSec++;
      const track = TRACKS[currentIndex];
      if (currentTimeSec >= track.duration) {
        if (isLoop) {
          currentTimeSec = 0;
        } else {
          nextTrack();
          return;
        }
      }
      updateProgressUI();
    }, 1000);
  }

  function stopPlaybackTimer() {
    if (playbackTimer) {
      clearInterval(playbackTimer);
      playbackTimer = null;
    }
  }

  function updateProgressUI() {
    const track = TRACKS[currentIndex];
    const percent = Math.min((currentTimeSec / track.duration) * 100, 100);
    progressFill.style.width = `${percent}%`;
    currentTimeEl.textContent = formatTime(currentTimeSec);
  }

  function nextTrack() {
    let nextIndex;
    if (isShuffle) {
      do {
        nextIndex = Math.floor(Math.random() * TRACKS.length);
      } while (nextIndex === currentIndex && TRACKS.length > 1);
    } else {
      nextIndex = (currentIndex + 1) % TRACKS.length;
    }
    loadTrack(nextIndex);
  }

  function prevTrack() {
    if (currentTimeSec > 4) {
      currentTimeSec = 0;
      updateProgressUI();
      return;
    }
    const prevIndex = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
    loadTrack(prevIndex);
  }

  // Seeking on Progress Bar
  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(clickX / rect.width, 1));
    const track = TRACKS[currentIndex];
    currentTimeSec = Math.floor(ratio * track.duration);
    updateProgressUI();
  });

  // Volume Adjustment
  function setVolume(val) {
    currentVolume = Math.max(0, Math.min(val, 1));
    volFill.style.width = `${currentVolume * 100}%`;
    if (masterGain && audioCtx) {
      masterGain.gain.setValueAtTime(isMuted ? 0 : currentVolume, audioCtx.currentTime);
    }
    updateVolumeIcon();
  }

  function updateVolumeIcon() {
    if (isMuted || currentVolume === 0) {
      volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
    } else if (currentVolume < 0.5) {
      volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
    } else {
      volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
    }
  }

  volTrack.addEventListener('click', (e) => {
    const rect = volTrack.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    isMuted = false;
    setVolume(clickX / rect.width);
  });

  volBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    if (masterGain && audioCtx) {
      masterGain.gain.setValueAtTime(isMuted ? 0 : currentVolume, audioCtx.currentTime);
    }
    updateVolumeIcon();
  });

  // Button Listeners
  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', nextTrack);
  prevBtn.addEventListener('click', prevTrack);

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
  });

  loopBtn.addEventListener('click', () => {
    isLoop = !isLoop;
    loopBtn.classList.toggle('active', isLoop);
  });

  likeBtn.addEventListener('click', () => {
    isLiked = !isLiked;
    likeBtn.classList.toggle('liked', isLiked);
  });

  // Playlist View Drawer
  function renderPlaylistItems() {
    drawerList.innerHTML = '';
    TRACKS.forEach((track, i) => {
      const item = document.createElement('div');
      item.className = `track-item ${i === currentIndex ? 'active' : ''}`;
      item.innerHTML = `
        <img class="track-item-img" src="${track.coverSvg}" alt="${track.title}" />
        <div class="track-item-info">
          <div class="track-item-name">${track.title}</div>
          <div class="track-item-sub">${track.artist}</div>
        </div>
        <div class="track-item-duration">${formatTime(track.duration)}</div>
      `;
      item.addEventListener('click', () => {
        loadTrack(i);
        if (!isPlaying) togglePlay();
        playlistDrawer.classList.remove('open');
      });
      drawerList.appendChild(item);
    });
  }

  playlistToggle.addEventListener('click', () => {
    playlistDrawer.classList.add('open');
  });

  closeDrawer.addEventListener('click', () => {
    playlistDrawer.classList.remove('open');
  });

  // Canvas Visualizer Loop
  function resizeCanvas() {
    vizCanvas.width = vizCanvas.parentElement.clientWidth;
    vizCanvas.height = vizCanvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);

    const barCount = 32;
    const barWidth = vizCanvas.width / barCount;
    let dataArray = new Uint8Array(barCount);

    if (analyser && isPlaying) {
      analyser.getByteFrequencyData(dataArray);
    } else {
      // Idle breathing ambient wave
      const time = Date.now() * 0.003;
      for (let i = 0; i < barCount; i++) {
        dataArray[i] = (Math.sin(time + i * 0.3) * 0.5 + 0.5) * 22;
      }
    }

    for (let i = 0; i < barCount; i++) {
      const heightPercent = dataArray[i] / 255;
      const barHeight = Math.max(3, heightPercent * vizCanvas.height * 0.85);

      const x = i * barWidth;
      const y = vizCanvas.height - barHeight;

      const gradient = vizCtx.createLinearGradient(0, y, 0, vizCanvas.height);
      gradient.addColorStop(0, 'rgba(236, 72, 153, 0.85)');
      gradient.addColorStop(1, 'rgba(139, 92, 246, 0.15)');

      vizCtx.fillStyle = gradient;
      vizCtx.beginPath();
      vizCtx.roundRect(x + 1.5, y, barWidth - 3, barHeight, [4, 4, 0, 0]);
      vizCtx.fill();
    }
  }

  // Keyboard Navigation Shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      nextTrack();
    } else if (e.code === 'ArrowLeft') {
      prevTrack();
    }
  });

  // Init
  loadTrack(0);
  drawVisualizer();
</script>
